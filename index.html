<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Список покупок</title>
    <link rel="stylesheet" href="css/style.css">
    <script type="module" src="js/main.js"></script>
</head>
<body>
    <div class="container">
        <h1>Список покупок</h1>
        <p>Добавь товары, которые нужно купить</p>
        <form id="add-form">
            <input type="text" id="input" placeholder="Введите название товара" required>
            <button type="submit">Добавить</button>
        </form>
        <div class="list">
            <h3 id="counter">Осталось купить 0</h3>
            <button id="clear">Очистить список</button>
        </div>
        <ul id="shopping-list"></ul>
        <p id="empty">Список пуст. Добавьте первый товар</p>
    </div>
</body>
</html>
